<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harshita Pishwe — Engineer & Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    :root {
      --beige: #F5F0E8;
      --beige-dark: #EDE6D6;
      --pink: #E77BAE;
      --pink-light: #F48FB1;
      --pink-pale: #FBEAF0;
      --rose: #C2527A;
      --brown: #A1887F;
      --brown-dark: #6D4C41;
      --text-dark: #2C1A12;
      --text-mid: #5C3D2E;
      --text-muted: #9A7B6F;
      --white: #FFFDF9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--beige);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Cormorant Garamond', serif;
    }

    .font-playfair {
      font-family: 'Playfair Display', serif;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--beige-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--pink);
      border-radius: 3px;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      background: rgba(245, 240, 232, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(231, 123, 174, 0.15);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--rose);
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-mid);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--pink);
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      background: var(--beige);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 4rem;
      position: relative;
      overflow: hidden;
    }

    .hero-bg-blob {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231, 123, 174, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-eyebrow {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 1rem;
    }

    .hero-headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      font-weight: 300;
      line-height: 1.0;
      text-align: center;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
    }

    .hero-headline em {
      font-style: italic;
      color: var(--pink);
    }

    .hero-sub {
      max-width: 560px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--text-mid);
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .hero-ctas {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 4rem;
    }

    .btn-primary {
      padding: 0.8rem 2rem;
      background: var(--rose);
      color: white;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary:hover {
      background: var(--pink);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(194, 82, 122, 0.3);
    }

    .btn-outline {
      padding: 0.8rem 2rem;
      background: transparent;
      color: var(--rose);
      border: 1.5px solid var(--rose);
      border-radius: 100px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-outline:hover {
      background: var(--rose);
      color: white;
      transform: translateY(-2px);
    }

    /* Avatar Scroll Section */
    .avatar-section {
      width: 100%;
      max-width: 900px;
      background: var(--white);
      border-radius: 24px;
      padding: 2.5rem 2rem 0;
      box-shadow: 0 4px 40px rgba(161, 136, 127, 0.12);
      /* Removed overflow: hidden so avatars aren't cut */
    }

    .avatar-scroll-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .avatar-track {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding-bottom: 0;
      margin-top: 1.5rem;
    }

    .avatar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.3s;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .avatar-item:nth-child(1) {
      animation-delay: 0.2s;
    }

    .avatar-item:nth-child(2) {
      animation-delay: 0.4s;
    }

    .avatar-item:nth-child(3) {
      animation-delay: 0.6s;
    }

    .avatar-item:nth-child(4) {
      animation-delay: 0.8s;
    }

    .avatar-item:nth-child(5) {
      animation-delay: 1s;
    }

    .avatar-item:hover {
      transform: translateY(-8px) !important;
    }

    .avatar-item.active {
      transform: translateY(-12px) !important;
    }

    .avatar-img-wrap {
      width: 110px;
      height: 130px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .avatar-img {
      width: 110px;
      height: auto;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 0 0 transparent);
    }

    .avatar-item.active .avatar-img {
      transform: scale(1.25) translateY(-8px);
      filter: drop-shadow(0 15px 25px rgba(231, 123, 174, 0.6));
    }

    .avatar-item:hover .avatar-img {
      transform: scale(1.15) translateY(-5px);
      filter: drop-shadow(0 15px 25px rgba(231, 123, 174, 0.5));
    }

    /* Floating Back Button styles */
    .fab-back {
      position: fixed;
      left: 2rem;
      bottom: 2rem;
      z-index: 1000;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: var(--pink);
      color: white;
      border: none;
      box-shadow: 0 8px 30px rgba(231, 123, 174, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .fab-back:hover {
      transform: translateY(-5px);
      background: var(--rose);
    }

    .avatar-emoji {
      font-size: 3.5rem;
      line-height: 1;
    }

    .avatar-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-mid);
      text-align: center;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .avatar-item.active .avatar-label {
      color: var(--rose);
    }

    .avatar-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.3s;
    }

    .avatar-item.active .avatar-dot {
      background: var(--pink);
    }

    .wave-divider {
      width: 100%;
      margin-top: 1.5rem;
    }

    /* Avatar Detail Panel */
    .avatar-detail {
      background: linear-gradient(135deg, var(--pink-pale) 0%, var(--beige) 100%);
      border-top: 1px solid rgba(231, 123, 174, 0.2);
      padding: 2rem;
      min-height: 180px;
      transition: all 0.4s ease;
    }

    .avatar-detail-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--rose);
      margin-bottom: 0.5rem;
    }

    .avatar-detail-desc {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--text-mid);
      line-height: 1.8;
      max-width: 600px;
    }

    .avatar-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .avatar-tag {
      padding: 0.3rem 0.8rem;
      background: white;
      border: 1px solid rgba(231, 123, 174, 0.3);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--rose);
    }

    /* Section styles */
    section {
      padding: 6rem 2rem;
    }

    .section-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.8rem;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 300;
      color: var(--text-dark);
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .section-title em {
      font-style: italic;
      color: var(--pink);
    }

    /* About */
    #about {
      background: var(--white);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      margin-top: 3rem;
    }

    .about-text p {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-mid);
      line-height: 1.9;
      margin-bottom: 1.2rem;
    }

    .about-text p strong {
      font-weight: 500;
      color: var(--text-dark);
    }

    .about-hobbies {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .hobby-card {
      background: var(--beige);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
      cursor: default;
      border: 1px solid transparent;
    }

    .hobby-card:hover {
      background: var(--pink-pale);
      border-color: rgba(231, 123, 174, 0.3);
      transform: translateY(-3px);
    }

    .hobby-icon {
      font-size: 1.6rem;
    }

    .hobby-name {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-mid);
      text-align: center;
    }

    .about-visual {
      position: relative;
    }

    .about-card-big {
      background: var(--beige);
      border-radius: 24px;
      padding: 2.5rem;
      border: 1px solid rgba(161, 136, 127, 0.2);
    }

    .about-stat {
      margin-bottom: 1.5rem;
    }

    .about-stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: var(--rose);
      line-height: 1;
    }

    .about-stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Timeline */
    #curriculum {
      background: var(--beige);
    }

    .timeline {
      position: relative;
      margin-top: 3rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--pink) 10%, var(--pink) 90%, transparent);
      transform: translateX(-50%);
    }

    .timeline-item {
      display: flex;
      justify-content: flex-end;
      width: 50%;
      padding-right: 3rem;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .timeline-item.right {
      justify-content: flex-start;
      padding-right: 0;
      padding-left: 3rem;
      margin-left: 50%;
    }

    .timeline-dot {
      position: absolute;
      right: -8px;
      top: 1.2rem;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--pink);
      border: 3px solid var(--beige);
      z-index: 2;
    }

    .timeline-item.right .timeline-dot {
      left: -8px;
      right: auto;
    }

    .timeline-card {
      background: var(--white);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 380px;
      box-shadow: 0 2px 20px rgba(161, 136, 127, 0.1);
      transition: all 0.3s;
    }

    .timeline-card:hover {
      box-shadow: 0 8px 30px rgba(231, 123, 174, 0.15);
      transform: translateY(-3px);
    }

    .timeline-sem {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--pink);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .timeline-subjects {
      list-style: none;
    }

    .timeline-subjects li {
      font-size: 0.88rem;
      color: var(--text-mid);
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(161, 136, 127, 0.1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .timeline-subjects li:last-child {
      border-bottom: none;
    }

    .timeline-subjects li::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--pink-light);
      flex-shrink: 0;
    }

    /* Experience */
    #experience {
      background: var(--white);
    }

    .exp-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .exp-card {
      background: var(--beige);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.5rem;
      align-items: start;
      border: 1px solid transparent;
      transition: all 0.3s;
    }

    .exp-card:hover {
      border-color: rgba(231, 123, 174, 0.25);
      background: var(--pink-pale);
    }

    .exp-icon {
      width: 52px;
      height: 52px;
      background: var(--pink-pale);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .exp-company {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .exp-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .exp-desc {
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--text-mid);
      line-height: 1.8;
    }

    .exp-outcomes {
      margin-top: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .exp-outcome {
      font-size: 0.82rem;
      color: var(--text-mid);
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .exp-outcome::before {
      content: '→';
      color: var(--pink);
      font-weight: 500;
      flex-shrink: 0;
    }

    .exp-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      font-style: italic;
    }

    .exp-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: var(--rose);
      color: white;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 500;
      margin-top: 0.8rem;
    }

    /* Projects */
    #projects {
      background: var(--beige);
    }

    .filter-bar {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin: 2rem 0;
    }

    .filter-btn {
      padding: 0.4rem 1.2rem;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 500;
      border: 1.5px solid rgba(161, 136, 127, 0.3);
      background: transparent;
      cursor: pointer;
      color: var(--text-mid);
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--rose);
      color: white;
      border-color: var(--rose);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(161, 136, 127, 0.15);
      transition: all 0.3s;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(231, 123, 174, 0.15);
    }

    .project-header {
      padding: 1.8rem 1.8rem 1rem;
    }

    .project-tag-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .project-tag {
      padding: 0.2rem 0.7rem;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .tag-software {
      background: #EDE8FF;
      color: #5C3AB5;
    }

    .tag-hardware {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .tag-iot {
      background: #E3F2FD;
      color: #1565C0;
    }

    .tag-ml {
      background: #FFF3E0;
      color: #E65100;
    }

    .tag-fullstack {
      background: var(--pink-pale);
      color: var(--rose);
    }

    .project-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .project-desc {
      font-size: 0.86rem;
      font-weight: 300;
      color: var(--text-mid);
      line-height: 1.8;
    }

    .project-footer {
      padding: 1rem 1.8rem 1.5rem;
      border-top: 1px solid rgba(161, 136, 127, 0.1);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .project-tech {
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      background: var(--beige);
      border-radius: 6px;
    }

    /* Tech Stack */
    #techstack {
      background: var(--white);
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .stack-card {
      background: var(--beige);
      border-radius: 20px;
      padding: 1.8rem;
      transition: all 0.3s;
    }

    .stack-card:hover {
      background: var(--pink-pale);
      transform: translateY(-3px);
    }

    .stack-category {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }

    .stack-category-icon {
      font-size: 1.3rem;
    }

    .stack-category-name {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--rose);
    }

    .stack-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stack-pill {
      padding: 0.4rem 1rem;
      background: white;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text-mid);
      border: 1px solid rgba(161, 136, 127, 0.2);
      transition: all 0.2s;
    }

    .stack-pill:hover {
      border-color: var(--pink);
      color: var(--rose);
    }

    /* Hobbies */
    #hobbies {
      background: var(--beige);
    }

    .hobbies-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .hobby-big-card {
      background: var(--white);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

        </div>
        <div className="footer-copy">© 2025 Harshita Pishwe. Designed with intention.</div>
      </footer>
    );
    const FloatingBackBtn = () => {
      const [show, setShow] = useState(false);
      useEffect(() => {
        const handleScroll = () => setShow(window.scrollY > 400);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
      if (!show) return null;
      return (
        <button className="fab-back animate-fade-up" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Back to Avatars">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
        </button>
      );
    };

    const App = () => (
      <>
        <FloatingBackBtn />
        <AvatarHero />
        <About />
        <Curriculum />
        <Experience />
        <Projects />
        <TechStack />
        <Hobbies />
        <Footer />
      </>
    );

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
